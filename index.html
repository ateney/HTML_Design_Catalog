<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="index.css" />
        <script src="catalog-data.js" defer></script>
        <script src="catalog.js" defer></script>
        <title>Design Catalog</title>
    </head>
    <body>
        <div class="page-shell">
            <header class="topbar">
                <div class="brand">Design Catalog</div>
                <nav class="nav">
                    <a href="#gallery">Gallery <span aria-hidden="true">↘</span></a>
                </nav>
            </header>
            <main>
                <section class="hero" aria-labelledby="page-title">
                    <div class="hero-copy">
                        <p class="eyebrow">welcome</p>
                        <h1 id="page-title">Design Catalog</h1>
                        <p class="subtitle">
                            お絵かき広場とも言うが、考える限りチリツモ的な場所。
                        </p>
                        <div class="actions">
                            <a class="primary" href="#gallery">
                                デザイン一覧を見る
                                <span aria-hidden="true">↘</span>
                            </a>
                        </div>
                    </div>

                    <div class="hero-card" aria-label="Preview panel">
                        <div class="mini-window">
                            <span class="dot red"></span>
                            <span class="dot yellow"></span>
                            <span class="dot green"></span>
                        </div>
                        <div class="preview-grid">
                            <div class="preview-panel large"></div>
                            <div class="preview-panel small"></div>
                            <div class="preview-panel small alt"></div>
                        </div>
                    </div>
                </section>

                <section class="gallery" id="gallery" aria-labelledby="gallery-title">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">the collection</p>
                            <h2 id="gallery-title">Design list<span>.</span></h2>
                        </div>
                        <p>気になるデザインから、ゆっくりどうぞ。</p>
                    </div>

                    <div class="card-grid" id="catalog-list" aria-live="polite">
                        <p class="catalog-message">デザインを読み込み中…</p>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
