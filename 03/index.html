<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f5f5f7" />
        <title>03 / カードボタン</title>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <main class="canvas">
            <button class="character-card" type="button">
                <span class="card-image" aria-hidden="true">
                    <span class="image-glow"></span>
                </span>

                <span class="character-info">
                    <span class="card-heading">
                        <span>
                            <span class="character-kicker">CHARACTER</span>
                            <span class="character-name">月乃 ユイ</span>
                        </span>
                    </span>
                    <span class="character-description">
                        静かな夜と、あたたかい飲み物が好き。
                    </span>
                </span>
            </button>
        </main>
    </body>
</html>
